<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Late Night Chess Logo">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1340"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59d0"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- Subtle star dots -->
  <circle cx="30"  cy="40"  r="1.2" fill="#c084fc" opacity="0.7"/>
  <circle cx="165" cy="55"  r="1"   fill="#ffffff"  opacity="0.5"/>
  <circle cx="50"  cy="150" r="1"   fill="#c084fc"  opacity="0.5"/>
  <circle cx="175" cy="140" r="1.3" fill="#ffffff"  opacity="0.6"/>
  <circle cx="145" cy="30"  r="1"   fill="#f5c842"  opacity="0.5"/>
  <circle cx="20"  cy="110" r="1"   fill="#ffffff"  opacity="0.4"/>

  <!-- Chess King piece (simplified) -->
  <!-- Base -->
  <rect x="66" y="148" width="68" height="10" rx="5" fill="url(#glowGrad)" filter="url(#glow)"/>
  <!-- Body -->
  <rect x="73" y="110" width="54" height="40" rx="6" fill="url(#glowGrad)" filter="url(#glow)"/>
  <!-- Neck -->
  <rect x="82" y="97" width="36" height="16" rx="4" fill="url(#glowGrad)"/>
  <!-- Head / cross base -->
  <rect x="79" y="78" width="42" height="22" rx="5" fill="url(#glowGrad)" filter="url(#glow)"/>
  <!-- Cross vertical -->
  <rect x="96" y="58" width="8" height="28" rx="3" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Cross horizontal -->
  <rect x="84" y="68" width="32" height="8" rx="3" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Glow ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#glowGrad)" stroke-width="1" opacity="0.35"/>

</svg>
